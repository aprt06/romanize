<!DOCTYPE html>
<html lang="en">
<head>
<viewport" content="width=device-width, initial-scale=1.0">
<charset" content="UTF-8">
  <meta name="viewport" contßent="width=device-width, initial-scale=1.0">
  <title>Thai2Rom</title>
</head>
<body>
  <h1>Thai to Romanization</h1>
  <form id="convert-form">
    <input type="text" id="text" placeholder="ใส่ข้อความภาษาไทย" required>
    <button type="submit">Convert</button>
  </form>

  <p id="result"></p>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("convert-form").addEventListener("submit", function (e) {
        e.preventDefault();
        const text = document.getElementById("text").value;
  
        fetch("/convert", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ text: text })
        })
          .then((response) => response.json())
          .then((data) => {
            const result = document.getElementById("result");
            result.innerText = data.romanized
              ? "Romanized: " + data.romanized
              : "Error: " + (data.error || "Unknown error");
          });
      });
    });
  </script>
</body>
</html>
